# A body's default ALSA output (`compose.py` mounts this at /etc/asound.conf): no device,
# so a body never reaches the owner's speakers, and the audio goes to the file named by
# RAIGOLMI_AUDIO_FILE (a WAV), or nowhere without one.
pcm.!default {
    type file
    slave.pcm { type null }
    file { @func getenv vars [ RAIGOLMI_AUDIO_FILE ] default "/dev/null" }
    format "wav"
}
