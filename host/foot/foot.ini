# The host's terminal — the AI terminal and a face's editor window. The colours are
# `ui/theme.py`'s palette, held to it by a test. A user's own ~/.config/foot/foot.ini replaces
# this file whole.

[main]
selection-target=both
font=DejaVu Sans Mono:size=11
pad=10x8

[colors]
background=101014
foreground=d8d8e0
selection-background=283457
selection-foreground=d8d8e0
regular0=16161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6
bright0=565f89
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=d8d8e0

# Selecting copies and right-click pastes, everywhere: a selection
# goes to the clipboard as well as the primary, and right-click pastes the primary, which every
# copy on this machine also sets (`clipboard.py`, the launcher's feed) — foot has no clipboard
# paste on a button. That takes right-click's `select-extend`; ctrl+shift+c, ctrl+shift+v and
# middle-click stay foot's own. Ctrl+V is never paste: it invited ctrl+c as copy.
# ⚠ Check a binding with `foot --check-config`: foot refuses the whole file over one bad name.
[mouse-bindings]
select-extend=none
primary-paste=BTN_MIDDLE BTN_RIGHT
