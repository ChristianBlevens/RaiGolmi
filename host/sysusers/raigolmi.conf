# The desktop user. raigolmid runs as this user, the session view setuids to it, and /work
# is its repository.
#
# `docker` is created here rather than relied on from the docker-ce package, so the
# membership line below cannot silently apply to a group that does not exist yet.
g docker  -
u agent   1000  "RaiGolmi"  /var/home/agent  /bin/bash
m agent   docker
m agent   wheel
