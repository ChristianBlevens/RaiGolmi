# The home directory: /home is a symlink to /var/home on a bootc host, and /var is
# populated per-machine at install time rather than from the image, so sysusers naming the
# directory is not enough to create it.
d /var/home/agent 0700 agent agent -

# The launcher socket directory. raigolmid cannot create this itself — it is under /run and
# it runs as a user — and it must be the *daemon's*: the session view's uid is its owner.
# Root-owned, every view's launcher is root with no capabilities, which cannot write a
# byte of /work while still answering `ping`.
#
# 0700 is also what keeps a launcher socket private: the socket is created inside the view
# by root and cannot be chowned afterwards (raigolmid/paths.py ensure()).
d /run/raigolmid       0755 agent agent -
d /run/raigolmid/views 0700 agent agent -

# The generated host-key bindings Sway includes. Created empty so that a boot in
# which raigolmid never starts still loads a valid config — the static fallback bindings in
# sway/config are the recovery path and they must not be lost to an include error.
f /run/raigolmid/host-keys.conf 0644 agent agent -

# A login key handed in at boot as the credential ssh.authorized_keys.agent — systemd's own
# ssh.authorized_keys.root (provision.conf), for the desktop user. /run, so it lasts one boot
# and a boot without the credential has no key; the user's ~/.ssh is never written. sshd
# reads it through sshd/raigolmi.conf, and tmpfiles sees it only through the ImportCredential
# in systemd/tmpfiles-setup-credentials.conf.
d  /run/raigolmi/ssh       0755 root root -
f^ /run/raigolmi/ssh/agent 0644 root root - ssh.authorized_keys.agent
