# The recovery shell, a designed feature rather than a leftover state.
#
# tty1 runs the host compositor and nothing else, so it is not a way back in when the
# compositor, its bindings or raigolmid are what is broken — and the account ships with no
# password, because `sysusers.d` cannot set one. Without this drop-in a host whose keys do
# not reach Sway has no console at all and the only move is a VM reset, which loses exactly
# the journal that would say why.
#
# So tty2 autologs in to a plain shell: /etc/profile.d/raigolmi-sway.sh starts sway on
# tty1 only. A user who directs an agent instead of knowing how needs a reachable shell
# more than a login prompt on a single-user machine.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin agent --noclear %I $TERM
