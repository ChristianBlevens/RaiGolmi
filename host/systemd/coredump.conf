# A core is kept only while it is small. Left to systemd's default (32G) a crash writes the
# whole core to /var before compressing it: an Electron editor's core runs to tens of
# gigabytes, which fills the disk the agents build on for the minute and a half it takes, and
# every write on the machine fails with ENOSPC until it gives up. The crash itself is still in
# the journal.
[Coredump]
ProcessSizeMax=1G
ExternalSizeMax=1G
MaxUse=1G
