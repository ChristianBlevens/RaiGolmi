# PID 1 pings the hardware watchdog, so a kernel that hangs stops the pings. The device is the
# q35 chipset's own TCO timer (iTCO_wdt, /dev/watchdog0), on which QEMU acts at the second
# expiry without a ping (hw/acpi/ich9_tco.c): two minutes into a silence, the span the launcher
# gives QEMU's own main loop before calling it hung (windows/RaiGolmi.cs HungAfter). QEMU pauses
# the guest then, and the launcher restarts the machine cold.
[Manager]
RuntimeWatchdogSec=1min
