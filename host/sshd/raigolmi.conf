# Password auth is Fedora's stock setting and sshd refuses an empty password; the account
# ships with none, so a booted image is unreachable until one is set at the console or a
# key is handed in at boot.
# The user's own keys, then any key handed in for this boot (tmpfiles/raigolmi.conf).
# Drop-ins are read before sshd_config and the first AuthorizedKeysFile wins.
AuthorizedKeysFile .ssh/authorized_keys /run/raigolmi/ssh/%u
